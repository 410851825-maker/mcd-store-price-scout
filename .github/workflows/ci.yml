name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run selftest
        run: python scripts/selftest.py

      - name: Verify offline demo runs
        run: python scripts/sample_runner.py

      - name: Verify amount precision (unit conversion self-check)
        run: |
          # 不依赖网络：校验离线样例下的单位换算与自洽性
          python - <<'PY'
          import sys, os
          sys.path.insert(0, "scripts")
          from selftest import load_sample, approx
          from price_scout import _to_float, StoreSnapshot

          sample = load_sample()
          bad = 0
          for st in sample["stores"]:
              for item in st["menu"].values():
                  cur = _to_float(item.get("currentPrice"))
                  orig = _to_float(item.get("originalPrice"))
                  if abs((orig - cur) - round(orig - cur, 2)) > 1e-9:
                      bad += 1
          assert bad == 0, f"发现 {bad} 项浮点尾数"
          # 分→元换算必须精确
          assert approx(710 / 100, 7.10), "分转元换算错误"
          assert approx(1390 / 100, 13.90), "分转元换算错误"
          # 整数判 0（券不生效）不得走浮点
          assert (0 == 0) and not (0.0000001 == 0), "整数判 0 逻辑异常"
          print("金额单位与精度校验通过")
          PY

      - name: Verify contest requirements
        run: |
          # 逐条对照官方活动规则做机器核验
          python scripts/verify_requirements.py

      - name: Verify no hardcoded token
        run: |
          # ★ 用形态检测，不在仓库里写入任何真实 token 字符串
          # 规则：混合大小写 + 含数字 + 长度 >= 24 的连续串（排除哈希与全大写标识符）
          python - <<'PY'
          import os, re, sys

          ALLOW = {"YOUR_MCP_TOKEN", "MCD_MCP_TOKEN", "MCP_TOKEN",
                   "AUTHORIZATION", "BEARER", "STREAMABLEHTTP", "HTTPS_MCD_CN"}
          BENIGN = [re.compile(r"^[A-F0-9]{64}$"), re.compile(r"^[A-Z0-9_]+$")]

          hits = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in (".git", "__pycache__")]
              for fn in files:
                  if not fn.endswith((".py", ".json", ".md", ".txt", ".yml", ".yaml")):
                      continue
                  path = os.path.join(root, fn)
                  try:
                      content = open(path, encoding="utf-8", errors="ignore").read()
                  except OSError:
                      continue
                  for lineno, line in enumerate(content.splitlines(), 1):
                      for cand in re.findall(r"[A-Za-z0-9]{16,}", line):
                          if cand in ALLOW:
                              continue
                          if any(p.match(cand) for p in BENIGN):
                              continue
                          if (len(cand) >= 24 and any(c.isdigit() for c in cand)
                                  and any(c.islower() for c in cand)
                                  and any(c.isupper() for c in cand)):
                              hits.append(f"{path}:{lineno}")

          if hits:
              print("::error::发现疑似明文 Token")
              for h in hits[:10]:
                  print(f"  {h}")
              sys.exit(1)
          print("未发现明文 Token")
          PY
          if grep -rInE "Bearer [A-Za-z0-9]{20,}" --include="*.py" --include="*.json" --include="*.md" .; then
            echo "::error::发现 Bearer 头携带疑似真实 Token"
            exit 1
          fi
          echo "Bearer 头检查通过"

      - name: Verify MCP config uses env placeholder
        run: |
          if ! grep -q 'MCD_MCP_TOKEN' mcp-config.example.json; then
            echo "::error::mcp-config.example.json 必须使用环境变量占位符"
            exit 1
          fi
          echo "MCP 配置使用环境变量占位符"
